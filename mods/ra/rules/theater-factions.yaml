# THEATER — 8 contemporary country factions, plus the faction-unique unlock wiring.
# The stock RA sub-factions are hidden from the lobby (not removed, so campaigns still work).
# Each faction's Construction Yard provides a `tech.<faction>` prerequisite (scoped by Factions:)
# that gates that faction's unique unit (see theater-units.yaml).

World:
	# Chat command: /factions (and /faction <name>) prints each bloc's identity + unique unit.
	TheaterCommands:
	Faction@federation:
		Name: faction-federation.name
		InternalName: federation
		Side: Allies
		Description: faction-federation.description
	Faction@northern_union:
		Name: faction-northern_union.name
		InternalName: northern_union
		Side: Soviet
		Description: faction-northern_union.description
	Faction@continental_bloc:
		Name: faction-continental_bloc.name
		InternalName: continental_bloc
		Side: Soviet
		Description: faction-continental_bloc.description
	Faction@rhine_compact:
		Name: faction-rhine_compact.name
		InternalName: rhine_compact
		Side: Allies
		Description: faction-rhine_compact.description
	Faction@isles_coalition:
		Name: faction-isles_coalition.name
		InternalName: isles_coalition
		Side: Allies
		Description: faction-isles_coalition.description
	Faction@eastern_maritime:
		Name: faction-eastern_maritime.name
		InternalName: eastern_maritime
		Side: Allies
		Description: faction-eastern_maritime.description
	Faction@subcontinent_federation:
		Name: faction-subcontinent_federation.name
		InternalName: subcontinent_federation
		Side: Soviet
		Description: faction-subcontinent_federation.description
	Faction@anatolian_alliance:
		Name: faction-anatolian_alliance.name
		InternalName: anatolian_alliance
		Side: Soviet
		Description: faction-anatolian_alliance.description
	# Repoint the Random pools at the contemporary factions (the stock sub-factions they used to roll
	# are now hidden, so rolling them would crash faction resolution at game start).
	Faction@randomallies:
		RandomFactionMembers: federation, rhine_compact, isles_coalition, eastern_maritime
	Faction@randomsoviet:
		RandomFactionMembers: northern_union, continental_bloc, subcontinent_federation, anatolian_alliance
	# Give every contemporary faction starting units (MCV + support) by adding them to the stock
	# StartingUnits groups, matched by side. (List fields are replaced, so restate stock + new.)
	StartingUnits@mcvonly:
		Factions: allies, england, france, germany, soviet, russia, ukraine, federation, northern_union, continental_bloc, rhine_compact, isles_coalition, eastern_maritime, subcontinent_federation, anatolian_alliance
	StartingUnits@lightallies:
		Factions: allies, england, france, germany, federation, rhine_compact, isles_coalition, eastern_maritime
	StartingUnits@heavyallies:
		Factions: allies, england, france, germany, federation, rhine_compact, isles_coalition, eastern_maritime
	StartingUnits@lightsoviet:
		Factions: soviet, russia, ukraine, northern_union, continental_bloc, subcontinent_federation, anatolian_alliance
	StartingUnits@heavysoviet:
		Factions: soviet, russia, ukraine, northern_union, continental_bloc, subcontinent_federation, anatolian_alliance
	# Hide the stock RA sub-factions from the lobby selector.
	Faction@england:
		Selectable: False
	Faction@france:
		Selectable: False
	Faction@germany:
		Selectable: False
	Faction@russia:
		Selectable: False
	Faction@ukraine:
		Selectable: False

# DEV: the "Unlock All Factions" lobby checkbox lives here (default OFF for normal play); the THEATER
# test map flips it ON. When enabled it grants every faction's tech prerequisite to every player.
Player:
	LobbyPrerequisiteCheckbox@DEVUNLOCK:
		ID: devunlock
		Label: checkbox-devunlock.label
		Description: checkbox-devunlock.description
		Enabled: False
		Visible: True
		DisplayOrder: 50
		Prerequisites: tech.federation, tech.northern_union, tech.continental_bloc, tech.rhine_compact, tech.isles_coalition, tech.eastern_maritime, tech.subcontinent_federation, tech.anatolian_alliance

# The Construction Yard provides each faction its own tech prerequisite (only for that faction).
FACT:
	ProvidesPrerequisite@federation:
		Prerequisite: tech.federation
		Factions: federation
	ProvidesPrerequisite@northern_union:
		Prerequisite: tech.northern_union
		Factions: northern_union
	ProvidesPrerequisite@continental_bloc:
		Prerequisite: tech.continental_bloc
		Factions: continental_bloc
	ProvidesPrerequisite@rhine_compact:
		Prerequisite: tech.rhine_compact
		Factions: rhine_compact
	ProvidesPrerequisite@isles_coalition:
		Prerequisite: tech.isles_coalition
		Factions: isles_coalition
	ProvidesPrerequisite@eastern_maritime:
		Prerequisite: tech.eastern_maritime
		Factions: eastern_maritime
	ProvidesPrerequisite@subcontinent_federation:
		Prerequisite: tech.subcontinent_federation
		Factions: subcontinent_federation
	ProvidesPrerequisite@anatolian_alliance:
		Prerequisite: tech.anatolian_alliance
		Factions: anatolian_alliance
