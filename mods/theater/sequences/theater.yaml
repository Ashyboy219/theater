# THEATER — bespoke sidebar cameos (full-colour PNG, drawn directly via PngSheet).
# Each icon is a uniquely-named sequence keyed under the actor's inherited RenderSprites.Image, so it
# never overwrites the stock unit's own `icon`. Buildable.Icon (theater-cameos.yaml) points each unit
# at its sequence. Filenames resolve in the theater|bits package (mods/theater/bits/).

mig:
	specter-icon:
		Filename: specter-cameo.png
	tejas-icon:
		Filename: tejas-cameo.png

