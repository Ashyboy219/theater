# --- Battlefield-identity pass: CUSTOM Blender-rendered unit BODY (full-colour PngSheet, 16 facings).
# This is a real in-world sprite, not just a cameo: the B-21 spawns as a stealth flying-wing silhouette,
# NOT the stock MIG jet body. b21body.png carries embedded FrameSize/FrameAmount metadata (16x 64px frames).
b21body:
	idle:
		Filename: b21body.png
		Facings: 32
		InterpolatedFacings: 64
	# Player-colour insignia: an indexed roundel painted in the remap band (index 88). The TrueColor body
	# itself cannot remap, so this small overlay (drawn on the `player` palette via WithIdleOverlay) carries
	# the owner's colour. Centred on the hull, orientation-independent (a disc), so it needs no per-facing art.
	roundel:
		Filename: roundel.shp
		Length: 1
	# keep the cameo reachable under this Image (Buildable.Icon resolves under the actor's RenderSprites.Image)
	b21-icon:
		Filename: b21-cameo.png

# Modern fighter-jet body (delta + twin tails) — shared by the manned jets RAPTOR/SPECTER/TEJAS, so they
