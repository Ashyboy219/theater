# Modern HD impact EXPLOSIONS: override the three common vehicle/unit-hit sequences in the stock `explosion`
# collection (small/med/large) — a billowing fireball (white-hot core -> orange) churning into grey smoke,
# with debris specks. Drawn procedurally (PIL/numpy, per-frame turbulence so it reads as organic fire, not a
# blob pattern). The other explosion sub-sequences (napalm/building/splashes) keep the stock art for now.
