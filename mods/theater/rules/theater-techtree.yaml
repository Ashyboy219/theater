# ============================================================================
# THEATER — TECH TREE: unlock nodes + their rewards.
#
# The 4X tech tree no longer buffs your army's numbers — every node UNLOCKS A NEW THING. This file holds the
# generic (all-faction) unlock nodes and the Theater Command support powers they grant. The age spine
# (theater-ages.yaml) and the three forks (research.mass/precision, research.wareconomy/industrial,
# research.maneuver/fortress) gate these; re-gated existing content (mobsam, fusion, bank, econ.network,
# the apex spectacle units, the space program) lives in its own files. Shown left-to-right in the F8 flowchart.
#
# Each node is a buy-once Command-queue actor (Interactable + BuildLimit:1 + ProvidesPrerequisite@self). The
# support powers are byte-for-byte clones of the PROVEN doctrine powers, reusing existing strike planes
# (strike.eagle/lancer/shahed/brahmos) — no new C#, no new art. Faction doctrine powers are untouched; these
# new powers use distinct @suffix + OrderName so they never collide with the baseline @coord paradrop.
# ============================================================================

# =================================== Unlock nodes (buy-once) ===================================
# Integrated Air Defense (tier 0) -> unlocks the shared Mobile SAM.
node.airdefense:
	Interactable:
	Tooltip:
		Name: actor-node-airdefense.name
	Buildable:
		Queue: Command
		BuildPaletteOrder: 30
		BuildLimit: 1
		BuildDuration: 300
		BuildDurationModifier: 100
		Prerequisites: rlab
		Description: actor-node-airdefense.description
		Icon: research-optics-icon
	Valued:
		Cost: 600
	RenderSprites:
		Image: dome
	ProvidesPrerequisite@self:

