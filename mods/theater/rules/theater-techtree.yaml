# =================================== The unlocked Theater Command support powers ===================================
# Field-merged onto THCOM. Each gated on its tree node / fork token, so it only appears once that node is bought.
THCOM:
	# node.recon -> Satellite Sweep (clone of the USA networked GpsPower).
	GpsPower@treerecon:
		Prerequisites: node.recon
		Icon: gps
		ChargeInterval: 4500
		Name: actor-thcom.treerecon-name
		Description: actor-thcom.treerecon-description
		RevealDelay: 375
		LaunchSpeechNotification: SatelliteLaunched
		LaunchTextNotification: notification-satellite-launched
		DisplayTimerRelationships: Ally, Neutral, Enemy
		SupportPowerPaletteOrder: 64
	# node.airpower -> Precision Air Wing (clone of the USA precision CAS; fast 2-jet JDAM run).
	AirstrikePower@treeair:
		OrderName: TreePrecisionStrike
		Prerequisites: node.airpower
		Icon: spyplane
		ChargeInterval: 4200
		Name: actor-thcom.treeair-name
		Description: actor-thcom.treeair-description
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: notification-select-target
		UnitType: strike.eagle
		SquadSize: 2
		SquadOffset: 1792,1792,0
		QuantizedFacings: 8
		CameraActor: camera
		CameraRemoveDelay: 150
		DisplayBeacon: true
		BeaconPoster: pbmbicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		UseDirectionalTarget: True
		DirectionArrowAnimation: paradirection
		SupportPowerPaletteOrder: 65
