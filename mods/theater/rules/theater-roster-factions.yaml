# THEATER — controlled per-faction LAND VARIANTS (priority factions).
#
# 1-2 grounded faction-specific land units each, so army composition feels different BEFORE the doctrine
# choice. Each reuses a stock body (RenderSprites Image mandatory) + a distinct weapon/role, gated
# tech.<faction> + weap (war factory). They do NOT duplicate the shared roster, the faction uniques, or
# the doctrine unlocks — each fills a national-identity gap. No new art, no new C#. Japan/Germany get none
# this pass (they keep the shared modern roster). All are faction-gated, so each AI only builds its own.

# ============================ USA (Federation) — precision / networked / air-ground ============================
# USA had NO land unique (both uniques are aircraft), so it gets two.

# M2 Bradley — advanced networked IFV: a 25mm autocannon (infantry/light) AND a Dragon ATGM (armor), plus a
# squad and extra vision. The versatile fire-support transport — distinct from the plain shared IFV (autocannon
# only). Countered by focused heavy anti-tank + artillery.
bradley:
	Inherits: APC
	RenderSprites:
		Image: apcbody
	Tooltip:
		Name: actor-bradley.name
	WithIdleOverlay@ROUNDEL:
		Sequence: roundel
		Palette: player
		IsPlayerPalette: True
		Offset: 0,0,86
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 95
		Prerequisites: tech.federation, weap
		Description: actor-bradley.description
	Valued:
		Cost: 1000
	Armament:
		Weapon: 25mm
		LocalOffset: 85,0,171
		MuzzleSequence: muzzle
	Armament@ATGM:
		Weapon: Dragon
		LocalOffset: 85,0,171
	RevealsShroud:
		MinRange: 4c0
		Range: 8c0
		RevealGeneratedShroud: False

# JTAC Humvee — recon + precision strike: a wide sight radius and a single Hellfire-class precision missile to
# designate and kill priority targets. Air-ground coordination on wheels; fragile, an escort/spotter not a brawler.
jtac:
