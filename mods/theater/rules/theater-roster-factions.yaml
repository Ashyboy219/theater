		Description: actor-jtac.description
	Valued:
		Cost: 700
	Armament:
		Weapon: HellfireAG
		LocalOffset: 128,0,43
		MuzzleSequence: muzzle
	RevealsShroud:
		MinRange: 0
		Range: 11c0
		RevealGeneratedShroud: False

# ============================ Russia (Northern Union) — heavy armor support ============================
# BMPT "Terminator" — tank-support on a heavy chassis: twin 25mm autocannons shred infantry/light AND a Dragon
# ATGM, NO transport. Escorts the armored fist and clears what the main guns can't. Countered by heavy tank guns
# + artillery. Distinct from Bastion (EW), Grad (rockets), Redoubt (APC) and the Molot doctrine heavy tank.
bmpt:
	Inherits: 3TNK
	RenderSprites:
