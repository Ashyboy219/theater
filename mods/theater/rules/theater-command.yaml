# THEATER — Command layer: army-wide TARGETING DOCTRINE (the "Fire Control" capability).
#
# A player-level ArmyCommand trait holds the doctrine and propagates a condition to every combat unit;
# condition-gated AutoTargetPriority profiles (Priority 20 > the stock default of 1) re-rank targets so
# the whole army re-prioritises at once.
#   0 balanced (default) · 1 structures · 2 armor · 3 infantry
# Set via the /target chat command and (later) the command-bar focus buttons. Fire Control gating — the
# doctrine stays locked to balanced until the capability is purchased — is wired with the Command queue
# in Phase 1. Pure data on top of one small player trait. Deterministic — no float/Random/DateTime.

Player:
	ArmyCommand:
	# Command-capability queue — a sidebar tab, like d2k's Upgrade queue. Active only while you own a
	# Theater Command (THCOM Produces: Command). Items are non-occupying buy-once unlocks. Declared after
	# ArmyCommand so it is never auto-selected as the game-start default tab.
	ClassicProductionQueue@Command:
		Type: Command
		ReadyAudio: NewOptions
		ReadyTextNotification: notification-new-construction-options
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled

# Ground combatants (and their assault-move variant, which inherits this).
^AutoTargetGround:
	ArmyCommandConsumer:
	AutoTargetPriority@CMDSTRUCT:
		RequiresCondition: cmd-focus-structures
		ValidTargets: Structure, Defense
		Priority: 20
	AutoTargetPriority@CMDARMOR:
		RequiresCondition: cmd-focus-armor
		ValidTargets: Vehicle
		Priority: 20
	AutoTargetPriority@CMDINF:
		RequiresCondition: cmd-focus-infantry
		ValidTargets: Infantry
		Priority: 20
	# --- ADVANCED TARGETING: always-on smart default (improves on top of manual Fire-Control, never replaces it).
	# Re-ranks the ALREADY-valid auto-targets (no NEW target types vs the stock @DEFAULT set) so a unit spends fire
	# on the real threat instead of whatever is merely nearest: air and mobile combat units outrank defensive
	# buildings. These sit ABOVE the stock default (Priority 1) but BELOW the manual focus (@CMD*, 20), so /target
	# still overrides on demand. A unit can never fire on something it couldn't already auto-target — this only
	# changes WHICH valid target it prefers. (ReturnFire stance already snaps a unit onto whoever shoots it; this
	# fixes the idle-scan pick so tanks stop chewing a pillbox while enemy armour shells them.)
	AutoTargetPriority@ADVAIR:
		ValidTargets: AirborneActor
		Priority: 14
	AutoTargetPriority@ADVMOBILE:
		ValidTargets: Vehicle, Ship, Underwater
		Priority: 10
	AutoTargetPriority@ADVINF:
		ValidTargets: Infantry, Mine
		Priority: 8
	AutoTargetPriority@ADVDEF:
		ValidTargets: Defense
		Priority: 5

# Air/ground all-target combatants (and their assault-move variant).
^AutoTargetAll:
	ArmyCommandConsumer:
	AutoTargetPriority@CMDSTRUCT:
		RequiresCondition: cmd-focus-structures
		ValidTargets: Structure, Defense
		Priority: 20
	AutoTargetPriority@CMDARMOR:
		RequiresCondition: cmd-focus-armor
		ValidTargets: Vehicle
		Priority: 20
	AutoTargetPriority@CMDINF:
		RequiresCondition: cmd-focus-infantry
		ValidTargets: Infantry
		Priority: 20
	# --- ADVANCED TARGETING: always-on smart default (see ^AutoTargetGround above). For all-target combatants
	# (incl. air-superiority fighters and AA), the air-preference (14) makes interceptors hunt aircraft first,
	# then mobile units, then infantry, with defensive buildings last. Manual /target (20) still overrides.
	AutoTargetPriority@ADVAIR:
		ValidTargets: AirborneActor
		Priority: 14
	AutoTargetPriority@ADVMOBILE:
		ValidTargets: Vehicle, Ship, Underwater
		Priority: 10
	AutoTargetPriority@ADVINF:
		ValidTargets: Infantry, Mine
		Priority: 8
	AutoTargetPriority@ADVDEF:
		ValidTargets: Defense
		Priority: 5
