# ============================================================================
# THEATER — Space Program: a late-game INVESTMENT TRACK (the "invest in a space program" pillar of the
# Civilization-but-realtime vision). Three buy-once stages in the Theater Command's Command queue, each
# gating the next, escalating from a launch site to orbital dominance. The payoff is INTEL/eyes-in-the-sky
# (not raw firepower), so it deepens the strategy without power-creeping the combat stack:
#   1. Launch Complex   — the entry investment; unlocks the program.
#   2. Recon Satellites — a periodic satellite sweep that reveals the map (GpsPower on the Theater Command).
#   3. Orbital Command  — capstone: a permanent orbital-surveillance net (+25% army-wide vision).
# Reuses the proven buy-once Command-queue + condition-grant patterns. All data-only, deterministic.
# Gated on tech.center so it's a genuine late-game commitment. (A future pass can add a space "victory".)
# ============================================================================

space.launch:
	Interactable:
	Tooltip:
		Name: actor-space-launch.name
	Buildable:
		Queue: Command
		BuildPaletteOrder: 80
		BuildLimit: 1
		BuildDuration: 600
		BuildDurationModifier: 100
		Prerequisites: tech.center, era.1
		Description: actor-space-launch.description
		Icon: space-launch-icon
	Valued:
		Cost: 1500
	RenderSprites:
		Image: dome
	ProvidesPrerequisite@self:

space.satellites:
	Interactable:
	Tooltip:
		Name: actor-space-satellites.name
	Buildable:
		Queue: Command
		BuildPaletteOrder: 81
		BuildLimit: 1
		BuildDuration: 700
		BuildDurationModifier: 100
		Prerequisites: space.launch, era.2
		Description: actor-space-satellites.description
		Icon: space-satellites-icon
	Valued:
		Cost: 2000
	RenderSprites:
		Image: dome
	ProvidesPrerequisite@self:

space.orbital:
	Interactable:
	Tooltip:
		Name: actor-space-orbital.name
	Buildable:
		Queue: Command
		BuildPaletteOrder: 82
		BuildLimit: 1
		BuildDuration: 800
		BuildDurationModifier: 100
		Prerequisites: space.satellites, era.3
		Description: actor-space-orbital.description
		Icon: space-orbital-icon
	Valued:
		Cost: 2500
	RenderSprites:
		Image: dome
	ProvidesPrerequisite@self:

# --- Science victory: replace the stock conquest-only win with one that ALSO wins by completing the Space
#     Program (the OrbitalPrerequisite) and holding a launch site (Theater Command) for the countdown. The
#     conquest win is folded into the same objective, so normal matches still end exactly as before. ---
Player:
	-ConquestVictoryConditions:
	SpaceVictoryConditions:
		OrbitalPrerequisite: space.orbital
		HoldDuration: 7500

# --- Orbital Lance delivery: a single high-altitude inbound carrying the OrbitalLance kinetic strike
#     (theater-strike.yaml). Clones the verified strike.brahmos (BADR.Bomber single-warhead delivery). ---
strike.orbital:
	Inherits: BADR.Bomber
	RenderSprites:
		Image: mig
	AmmoPool:
		Ammo: 1
	Armament:
		Weapon: OrbitalLance

# --- The Theater Command hosts the two space-program support powers: Satellites = eyes (recon sweep),
#     Orbital Command = the capstone STRIKE. So the space race finally pays off in raw power, not just intel,
#     but only at the very top of the longest tech path in the game (and on a long charge). ---
THCOM:
	GpsPower@spacesat:
		Prerequisites: space.satellites
		Icon: gps
		ChargeInterval: 7500
		Name: actor-thcom.spacesat-name
		Description: actor-thcom.spacesat-description
		RevealDelay: 375
		LaunchSpeechNotification: SatelliteLaunched
		LaunchTextNotification: notification-satellite-launched
		DisplayTimerRelationships: Ally, Neutral, Enemy
		SupportPowerPaletteOrder: 62
	# Orbital Lance — the Space Program capstone. A single devastating kinetic strike dropped from orbit on
	# any visible target. Gated on the Orbital Command stage; long charge; telegraphed (beacon + camera), so
	# it is decisive but counterable. The payoff for completing the whole space track.
	AirstrikePower@orbitalstrike:
		OrderName: OrbitalStrike
		Prerequisites: space.orbital
		Icon: parabombs
		ChargeInterval: 9000
		Name: actor-thcom.orbital-name
		Description: actor-thcom.orbital-description
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: notification-select-target
		UnitType: strike.orbital
		SquadSize: 1
		SquadOffset: 1792,1792,0
		QuantizedFacings: 8
		CameraActor: camera
		CameraRemoveDelay: 150
		DisplayBeacon: true
		BeaconPoster: pbmbicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		UseDirectionalTarget: True
		DirectionArrowAnimation: paradirection
		SupportPowerPaletteOrder: 63

# --- Orbital Command capstone: a permanent orbital-surveillance net — +25% vision army-wide while held. ---
^Vehicle:
	GrantConditionOnPrerequisite@space-orbital:
		Condition: space-orbital
		Prerequisites: space.orbital
	RevealsShroudMultiplier@space-orbital:
		RequiresCondition: space-orbital
		Modifier: 125

^Infantry:
	GrantConditionOnPrerequisite@space-orbital:
		Condition: space-orbital
		Prerequisites: space.orbital
	RevealsShroudMultiplier@space-orbital:
		RequiresCondition: space-orbital
		Modifier: 125

^Ship:
	GrantConditionOnPrerequisite@space-orbital:
		Condition: space-orbital
		Prerequisites: space.orbital
	RevealsShroudMultiplier@space-orbital:
		RequiresCondition: space-orbital
		Modifier: 125

^Plane:
	GrantConditionOnPrerequisite@space-orbital:
		Condition: space-orbital
		Prerequisites: space.orbital
	RevealsShroudMultiplier@space-orbital:
		RequiresCondition: space-orbital
		Modifier: 125
