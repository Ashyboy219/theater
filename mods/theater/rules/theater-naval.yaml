# THEATER — grounded modern naval layer.
#
# The mod was land+air only; this adds a sea layer. The SHARED surface roster is the stock RA fleet, which
# every theater faction can already build from a Naval Yard (SYRD, granted via structures.allies):
#   PT  (Patrol Boat) ... cheap fast patrol + anti-submarine depth charges + sonar.
#   DD  (Destroyer) ..... escort: anti-air (Stinger/StingerAA) + anti-sub (DepthCharge) + sonar detection.
#   CA  (Cruiser) ....... naval artillery — long-range 8-inch shore/ship bombardment.
#   LST (Landing craft) . amphibious transport (infantry + vehicles).
# Submarines were UNBUILDABLE for theater factions: stock SS/MSUB gate on ~spen (the SOVIET Sub Pen), which
# no theater faction can build (they all hold Allied tokens). The fix needs NO structure edit: the faction
# subs below re-route BuildAtProductionType from `Submarine` to `Boat`, so they build from the Naval Yard.
#
# Each priority faction then gets ONE signature naval unit (reusing a stock hull — DD/SS/PT — so no new art),
# faction-gated (tech.<faction> + syrd). Broad national naval character comes from the ^Ship doctrine profiles
# in theater-doctrines.yaml (Russia heavy, China cheap-mass, India long-reach, Turkey/USA/UK sensors). No new
# C#. Counters are native: DD/PT depth-charges + sonar kill subs; ship AA kills aircraft; strike aircraft and
# cruisers kill ships; submerged subs are detectable (no invisible deletion — they surface to fire torpedoes).

# ============================ USA (Federation) — Aegis air-naval defense ============================
# Arleigh Burke-class Aegis destroyer: the premier escort. Hardened hull, superior sensors + sonar (the
# "Aegis picture") on top of the DD's AA + anti-sub kit. Pairs with USA's air arm for sea control. Reuses DD.
BURKE:
	Inherits: DD
	# Battlefield body: spawns as a modern guided-missile destroyer (ddbody), not the stock RA destroyer.
	# Centre the turret mount so the separately-rendered gun composites over the hull (see ddbody sequence).
	RenderSprites:
		Image: ddbody
	Turreted:
		Offset: 0,0,0
	WithIdleOverlay@ROUNDEL:
		Sequence: roundel
		Palette: player
		IsPlayerPalette: True
		Offset: 0,0,86
	Tooltip:
		Name: actor-burke.name
	Buildable:
		Queue: Ship
		BuildAtProductionType: Boat
		BuildPaletteOrder: 46
		Prerequisites: tech.federation, syrd, dome
		Description: actor-burke.description
	Valued:
		Cost: 1400
	Health:
		HP: 52000
	RevealsShroud:
		MinRange: 4c0
		Range: 8c0
		RevealGeneratedShroud: False
	DetectCloaked:
		Range: 7c0
		DetectionTypes: Underwater, Cloak
	# Aegis AIR-DEFENSE escort, NOT a Destroyer clone: drop the anti-ship gun (PRIMARY Stinger) and the
	# depth charge (SECONDARY), and mount a long-range SAM (Nike) on the main turret. Keeps the DD's
	# StingerAA point-defence (TERTIARY). Net: dominates aircraft + incoming missiles, near-helpless vs
	# ships/subs — a true fleet air-defence escort that must be screened by surface combatants.
	-Armament@SECONDARY:
	Armament@PRIMARY:
		Weapon: Nike
		LocalOffset: 0,-100,0, 0,100,0
		LocalYaw: 64, -64

# ============================ Russia (Northern Union) — attack submarine ============================
# Akula-class hunter-killer sub: stealthy torpedo boat that ambushes surface ships, then submerges. The
# Russia ^Ship profile (tanky + firepower) makes it a heavy threat. Countered by enemy sonar + depth charges
# (DD/PT) — it must stay hidden, and it surfaces (becomes visible) when it fires. Reuses the stock SS hull.
AKULA:
	Inherits: SS
	# Battlefield body: spawns as a modern hunter-killer submarine (subbody), not the stock RA sub.
	RenderSprites:
		Image: subbody
	Tooltip:
		Name: actor-akula.name
	WithIdleOverlay@ROUNDEL:
		Sequence: roundel
		Palette: player
		IsPlayerPalette: True
		Offset: 0,0,86
	Buildable:
		Queue: Ship
		BuildAtProductionType: Boat
		BuildPaletteOrder: 36
		Prerequisites: tech.northern_union, syrd
		Description: actor-akula.description
	Valued:
		Cost: 1000
	# Heavy hunter-killer (NOT an SS clone): a tankier hull and a 3-torpedo HEAVY salvo (HeavyTorp) — the
	# biggest single torpedo alpha-strike in the game, but slow to reload, so a missed ambush is punished.
	# Distinct from UK's ASTUTE (quiet single torpedo + best sonar). Narrow sonar: it's a striker, not a scout.
	Health:
		HP: 32000
	Armament:
		Weapon: HeavyTorp
		LocalOffset: 0,-171,0, 0,171,0
		FireDelay: 2

# ============================ China (Continental Bloc) — mass missile boat ============================
# Houbei-class missile catamaran: a dirt-cheap fast boat trading the gun for anti-ship/shore missiles
# (longer reach than the patrol gun). The China ^Ship cost profile makes it cheaper still — swarm the
# littoral with them (coastal missile pressure). Fragile; dies to destroyers/aircraft. Reuses the PT hull.
HOUBEI:
	Inherits: PT
	RenderSprites:
		Image: pt
	Tooltip:
		Name: actor-houbei.name
	Buildable:
		Queue: Ship
		BuildAtProductionType: Boat
		BuildPaletteOrder: 24
		Prerequisites: tech.continental_bloc, syrd
		Description: actor-houbei.description
	Valued:
		Cost: 450
	# Fast coastal MISSILE boat (NOT a gunboat clone): trades the patrol gun for anti-ship missiles and
	# DROPS the depth charge + sonar — it cannot fight subs or aircraft, only alpha-strike ships then flee.
	# Cheap + fast (China ^Ship cost profile) → swarm the littoral with hit-and-run missile pressure.
	-Armament@SECONDARY:
	-DetectCloaked:
	-RenderDetectionCircle:
	Armament@PRIMARY:
		Weapon: Stinger
		LocalOffset: 208,0,48
		MuzzleSequence: muzzle

# ============================ Turkey (Anatolian Alliance) — USV recon patrol ============================
# Unmanned surface vessel: a fast, far-seeing drone boat with sonar — littoral control and naval recon.
# Spots the sea (and submerged subs) first, screens the fleet, harasses with a light gun. Reuses the PT hull.
BARBAROS:
	Inherits: PT
	RenderSprites:
		Image: pt
	Tooltip:
		Name: actor-barbaros.name
	Buildable:
		Queue: Ship
		BuildAtProductionType: Boat
		BuildPaletteOrder: 24
		Prerequisites: tech.anatolian_alliance, syrd
		Description: actor-barbaros.description
	Valued:
		Cost: 500
	Mobile:
		Speed: 175
	RevealsShroud:
		MinRange: 6c0
		Range: 11c0
		RevealGeneratedShroud: False
	# A recon platform: detects BOTH submerged subs (sonar) AND cloaked land/air stealth in its patrol radius,
	# so Turkey's USV is the eyes of the littoral — spots what's hidden, on the surface and below it.
	DetectCloaked:
		Range: 6c0
		DetectionTypes: Underwater, Cloak
	# ...but its TEETH are deliberately weak (recon over firepower): swap the patrol cannon for a light MG
	# (harass only), keeping the depth charge so it can finish a sub it has detected. Loses any straight fight.
	Armament@PRIMARY:
		Weapon: M60mg
		LocalOffset: 208,0,48

# ============================ UK (Isles Coalition) — intelligence attack submarine ============================
# Astute-class SSN: a quieter hunter-killer with the best sonar in the game (detects subs AND cloak) and a
# wide sight — UK's naval intelligence arm. Hunts other submarines and scouts unseen. Reuses the stock SS hull.
ASTUTE:
	Inherits: SS
	RenderSprites:
		Image: subbody
	Tooltip:
		Name: actor-astute.name
	WithIdleOverlay@ROUNDEL:
		Sequence: roundel
		Palette: player
		IsPlayerPalette: True
		Offset: 0,0,86
	Buildable:
		Queue: Ship
		BuildAtProductionType: Boat
		BuildPaletteOrder: 36
		Prerequisites: tech.isles_coalition, syrd
		Description: actor-astute.description
	Valued:
		Cost: 1100
	RevealsShroud:
		MinRange: 5c0
		Range: 10c0
		RevealGeneratedShroud: False
	DetectCloaked:
		Range: 8c0
		DetectionTypes: Underwater, Cloak
	# A QUIET hunter-killer, not a stock SS torpedo boat: a single precision torpedo fired on a faster cadence at
	# longer reach (QuietTorp), lower alpha than AKULA's 3-torp salvo. Pairs with the best sonar above to stalk and
	# snipe subs/scouts from detection range — UK's patient intelligence sub, distinct from Russia's alpha-striker.
	Armament:
		Weapon: QuietTorp
		LocalOffset: 0,-171,0, 0,171,0

# ============================ India (Subcontinent Federation) — missile destroyer ============================
# Kolkata-class guided-missile destroyer: a hardened air-defense + anti-ship platform. The India ^Ship range
# profile pushes its missiles/AA out to standoff range — layered sea control and regional reach. Reuses DD.
KOLKATA:
	Inherits: DD
	RenderSprites:
		Image: ddbody
	Turreted:
		Offset: 0,0,0
	WithIdleOverlay@ROUNDEL:
		Sequence: roundel
		Palette: player
		IsPlayerPalette: True
		Offset: 0,0,86
	Tooltip:
		Name: actor-kolkata.name
	Buildable:
		Queue: Ship
		BuildAtProductionType: Boat
		BuildPaletteOrder: 46
		Prerequisites: tech.subcontinent_federation, syrd, dome
		Description: actor-kolkata.description
	Valued:
		Cost: 1300
	Health:
		HP: 50000
	# Layered sea control includes the sensor picture: this hull's radar/sonar sees further than a stock
	# destroyer and detects cloaked stealth as well as submerged subs — India's standoff fleet fights informed.
	DetectCloaked:
		Range: 7c0
		DetectionTypes: Underwater, Cloak
	# Standoff anti-SHIP missile destroyer (NOT a BURKE/DD clone — USA's BURKE is pure AA): swap the main
	# mount for a long-reach anti-ship missile (Maverick, MinRange 2c0 so it must stand off and cannot brawl
	# close), and DROP the depth charge. India's ^Ship RangeMultiplier stretches its reach further. Keeps the
	# StingerAA (TERTIARY) for self-defence. The long-reach glass artillery of the sea.
	-Armament@SECONDARY:
	Armament@PRIMARY:
		Weapon: Maverick
		LocalOffset: 0,-100,0, 0,100,0
		LocalYaw: 64, -64
