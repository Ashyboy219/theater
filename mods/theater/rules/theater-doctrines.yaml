# THEATER — faction DOCTRINES.
#
# Each faction's whole army behaves differently, so an experienced player can read the faction from how
# it fights. Pure data: a per-faction condition (doctrine-<faction>) is granted to every unit a faction
# owns (GrantConditionOnPrerequisite keyed on the conyard's tech.<faction> token), and stock conditional
# multiplier traits apply the strengths AND tradeoffs. Production cost/time multipliers are read off the
# unit being built and gated by the same tech.<faction> prerequisite. Everything here applies identically
# to human and AI armies (the AI's conyard provides the same token). Determinism-safe (stock sim traits,
# integer modifiers, no float/Random/DateTime).
#
# Design rule: every strength is paired with a weakness — no faction is just "stronger numbers".
#   Federation (USA)        : far-seeing, long-range, cheap/fast AIR — but FRAGILE ground vehicles.
#   Northern Union (Russia) : TANKY, hard-hitting vehicles — but SLOW.
#   Continental Bloc (China): everything CHEAP + builds FAST — but FRAGILE (the printed-attrition army).
#   Rhine Compact (Germany) : DURABLE units — but EXPENSIVE and slow to build (fewer, harder to kill).
#   Isles Coalition (UK)    : long-range, far-seeing, cheaper INFANTRY — but WEAK vehicles.
#   Eastern Maritime (Japan): DURABLE units — but LOW damage output (holds ground, can't brawl forward).
#   Subcontinent (India)    : long REACH vehicles — but SLOW (layered, deliberate).
#   Anatolian (Turkey)      : cheap/fast, far-seeing AIR + attritable everything — but FRAGILE all over.

# ============================ VEHICLE TIER ============================
^Vehicle:
	GrantConditionOnPrerequisite@doc-fed:
		Condition: doctrine-federation
		Prerequisites: tech.federation
	GrantConditionOnPrerequisite@doc-nu:
		Condition: doctrine-northern_union
		Prerequisites: tech.northern_union
	GrantConditionOnPrerequisite@doc-cb:
		Condition: doctrine-continental_bloc
		Prerequisites: tech.continental_bloc
	GrantConditionOnPrerequisite@doc-rc:
		Condition: doctrine-rhine_compact
		Prerequisites: tech.rhine_compact
	GrantConditionOnPrerequisite@doc-ic:
		Condition: doctrine-isles_coalition
		Prerequisites: tech.isles_coalition
	GrantConditionOnPrerequisite@doc-em:
		Condition: doctrine-eastern_maritime
		Prerequisites: tech.eastern_maritime
	GrantConditionOnPrerequisite@doc-sf:
		Condition: doctrine-subcontinent_federation
		Prerequisites: tech.subcontinent_federation
	GrantConditionOnPrerequisite@doc-aa:
		Condition: doctrine-anatolian_alliance
		Prerequisites: tech.anatolian_alliance
	# Federation — fragile ground (air is the strength, paid for here).
	DamageMultiplier@doc-fed:
		RequiresCondition: doctrine-federation
		Modifier: 110
	# Northern Union — tanky, hard-hitting, but slow.
	DamageMultiplier@doc-nu:
		RequiresCondition: doctrine-northern_union
		Modifier: 82
	FirepowerMultiplier@doc-nu:
		RequiresCondition: doctrine-northern_union
		Modifier: 112
	SpeedMultiplier@doc-nu:
		RequiresCondition: doctrine-northern_union
		Modifier: 85
	# Continental Bloc — cheap, fast to build, fragile.
	DamageMultiplier@doc-cb:
		RequiresCondition: doctrine-continental_bloc
		Modifier: 120
	ProductionCostMultiplier@doc-cb:
		Prerequisites: tech.continental_bloc
		Multiplier: 80
	ProductionTimeMultiplier@doc-cb:
		Prerequisites: tech.continental_bloc
		Multiplier: 80
	# Rhine Compact — durable, but expensive and slow to build.
	DamageMultiplier@doc-rc:
		RequiresCondition: doctrine-rhine_compact
		Modifier: 82
	ProductionCostMultiplier@doc-rc:
		Prerequisites: tech.rhine_compact
		Multiplier: 118
	ProductionTimeMultiplier@doc-rc:
		Prerequisites: tech.rhine_compact
		Multiplier: 112
	# Isles Coalition — weak vehicles (infantry/intel is the strength).
	DamageMultiplier@doc-ic:
		RequiresCondition: doctrine-isles_coalition
		Modifier: 112
	# Eastern Maritime — durable but low offense (turtle/hold).
	DamageMultiplier@doc-em:
		RequiresCondition: doctrine-eastern_maritime
		Modifier: 85
	FirepowerMultiplier@doc-em:
		RequiresCondition: doctrine-eastern_maritime
		Modifier: 90
	# Subcontinent Federation — long reach, but slow.
	RangeMultiplier@doc-sf:
		RequiresCondition: doctrine-subcontinent_federation
		Modifier: 115
	SpeedMultiplier@doc-sf:
		RequiresCondition: doctrine-subcontinent_federation
		Modifier: 88
	# Anatolian Alliance — attritable (cheap eyes, dies fast) BUT FAST: rapid-response mobility is the
	# identity that separates Turkey from USA (durable long-range air) and China (slow mass ground).
	DamageMultiplier@doc-aa:
		RequiresCondition: doctrine-anatolian_alliance
		Modifier: 115
	SpeedMultiplier@doc-aa:
		RequiresCondition: doctrine-anatolian_alliance
		Modifier: 112

