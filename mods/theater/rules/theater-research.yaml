# THEATER — 4X P1: RESEARCH LAB + the first branching tech tree.
#
# A mid-tier Research Lab (rlab) that feeds the existing Command queue (the sidebar tab THCOM also opens)
# and gates a set of ACCUMULATING research upgrades — bought one at a time, like Civ techs, each taking real
# time — plus one branching DECISION (mass vs precision). This is the first economy/depth layer: research is
# a mid-game progression that makes games longer and adds choices ON TOP OF the doctrine fork.
#
# Reuses two PROVEN patterns, so no new C# and no new sidebar tab:
#   1. Buy-once Command-queue actors (theater-capabilities.yaml): non-occupying, BuildLimit:1,
#      ProvidesPrerequisite@self (token = actor name), Icon: icon, RenderSprites Image: dome.
#   2. Doctrine condition-grants (theater-doctrine-*.yaml): GrantConditionOnPrerequisite ON THE UNIT
#      TEMPLATE (^Vehicle/^Infantry, NOT Player) + a RequiresCondition *Multiplier. ProductionCostMultiplier
#      reads Prerequisites directly (no condition). All integer, deterministic.
#
# NOTE (later art pass): rlab reuses the radar-dome body for now (like THCOM); a distinct Research Lab body
# is a visual-revamp item. The mechanics are the P1 deliverable.

# =================================== The Research Lab building ===================================
# Mid-tier (needs a Radar Dome first), feeds the Command queue, and provides the `rlab` token that unlocks
# every research item below. Build one to start researching.
rlab:
	Inherits: DOME
	RenderSprites:
		Image: dome
	Buildable:
		Queue: Building
		BuildPaletteOrder: 136
		Prerequisites: dome, ~structures.allies, ~techlevel.medium
		Description: actor-rlab.description
		Icon: rlab-icon
	Valued:
		Cost: 1400
	Tooltip:
		Name: actor-rlab.name
	Production:
		Produces: Command
	ProvidesPrerequisite@self:

# =================================== The research items (Command queue) ===================================
# Each is gated on `rlab`, takes ~real time (BuildDuration), and provides its own token (research.<x>) that
# the ^Vehicle/^Infantry multipliers below key off. Accumulating — research as many as you can afford.

research.ballistics:
