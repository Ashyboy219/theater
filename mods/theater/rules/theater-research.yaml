# =================================== Effects (condition-grants on the templates) ===================================
# Grant a condition on the TEMPLATE when its research token exists, then a RequiresCondition multiplier reads
# it (the proven doctrine pattern). ProductionCostMultiplier reads Prerequisites directly. All stack with
# doctrines/national profiles multiplicatively.
^Vehicle:
	GrantConditionOnPrerequisite@res-ballistics:
		Condition: res-ballistics
		Prerequisites: research.ballistics
	FirepowerMultiplier@res-ballistics:
		RequiresCondition: res-ballistics
		Modifier: 115
	GrantConditionOnPrerequisite@res-armor:
		Condition: res-armor
		Prerequisites: research.armor
	DamageMultiplier@res-armor:
		RequiresCondition: res-armor
		Modifier: 88
	GrantConditionOnPrerequisite@res-optics:
		Condition: res-optics
		Prerequisites: research.optics
	RevealsShroudMultiplier@res-optics:
		RequiresCondition: res-optics
		Modifier: 120
	GrantConditionOnPrerequisite@res-propulsion:
		Condition: res-propulsion
		Prerequisites: research.propulsion
	SpeedMultiplier@res-propulsion:
		RequiresCondition: res-propulsion
		Modifier: 112
	# logistics: cheaper vehicles (cost reads Prerequisites directly, no condition needed)
	ProductionCostMultiplier@res-logistics:
		Prerequisites: research.logistics
		Multiplier: 88
	# DECISION — mass: even cheaper, but frailer
	ProductionCostMultiplier@res-mass:
		Prerequisites: research.mass
		Multiplier: 85
	GrantConditionOnPrerequisite@res-mass:
		Condition: res-mass
		Prerequisites: research.mass
	DamageMultiplier@res-mass:
		RequiresCondition: res-mass
		Modifier: 110
	# DECISION — precision: stronger, but pricier
	GrantConditionOnPrerequisite@res-precision:
		Condition: res-precision
		Prerequisites: research.precision
	FirepowerMultiplier@res-precision:
		RequiresCondition: res-precision
		Modifier: 122
	ProductionCostMultiplier@res-precision:
		Prerequisites: research.precision
		Multiplier: 110

^Infantry:
	GrantConditionOnPrerequisite@res-optics:
		Condition: res-optics
		Prerequisites: research.optics
	RevealsShroudMultiplier@res-optics:
		RequiresCondition: res-optics
		Modifier: 120
	GrantConditionOnPrerequisite@res-smallarms:
		Condition: res-smallarms
		Prerequisites: research.smallarms
	FirepowerMultiplier@res-smallarms:
		RequiresCondition: res-smallarms
		Modifier: 115
