# THEATER — 4X P4: GARGANTUAN SPECTACLE UNITS (the "look at this HUGE ship" payoff).
#
# The apex reward at the top of the 4X ladder. The first spectacle unit is the LEVIATHAN — an arsenal
# dreadnought rendered at DOUBLE size (128px body, ~2x every other unit on the battlefield) so it is
# genuinely awe-inspiring on screen. Gated behind the ENTIRE progression: Naval Yard + the Orbital age
# (which itself required Research Lab → Information → Tech Center → Autonomous) + the `alloys` strategic
# resource. Reaching it means you built the whole 4X engine — and it shows.
#
# Data + art (no new C#): inherits the stock Cruiser (CA, naval artillery) for the ship base, swaps in the
# 128px leviathanbody (all gun batteries baked into the hull, so the turret sprites are removed), a heavier
# main battery (LeviathanGun) + AA self-defence, gargantuan HP, and a hard BuildLimit so it stays special.

LEVIATHAN:
	Inherits: CA
	# Engage both ground/water (main guns) and air (AA secondary).
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	# 128px gargantuan body; all gun batteries are baked into the hull, so drop the cruiser's turret sprites.
	RenderSprites:
		Image: leviathanbody
	-WithSpriteTurret@PRIMARY:
	-WithSpriteTurret@SECONDARY:
	Tooltip:
		Name: actor-leviathan.name
	Buildable:
		Queue: Ship
		BuildAtProductionType: Boat
		BuildPaletteOrder: 60
		BuildLimit: 2
		Prerequisites: ~syrd, age.orbital, ~structures.allies
		Description: actor-leviathan.description
		Icon: leviathan-icon
	Valued:
		Cost: 6000
	Health:
		HP: 500000
	Mobile:
		Speed: 28
		TurnSpeed: 6
	# Devastating main battery (longest reach in the game) + AA self-defence so it isn't air-helpless.
	Armament@PRIMARY:
		Weapon: LeviathanGun
	Armament@SECONDARY:
		Weapon: Nike
	RevealsShroud:
		MinRange: 4c0
		Range: 9c0
	# Huge selection/decoration footprint to match the 128px sprite.
	Selectable:
		Bounds: 3072, 2048
		DecorationBounds: 3072, 2560, 0, -256
