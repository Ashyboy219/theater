# THEATER — shared "advanced coordination" structures.
#
# THCOM (Theater Command) is the lightweight command-capability building: a forward command post that
# gives you radar AND a real VERB — a combined-arms paradrop that coordinates reinforcements from the sky
# with your ground push. It reskins the radar dome (proven art/footprint) and adds a self-contained
# support power, so it is capture-safe. In Phase 1 it also hosts the Command production queue (Produces:
# Command) from which you buy capabilities — Fire Control, Formations, etc.

THCOM:
	Inherits: DOME
	# Bespoke forward-command-post body instead of the radar dome (DOME already uses WithSpriteBody, so the
	# image swap + thcombody sequences are all that's needed). 2x2 footprint, rendered at matching DOME scale.
	RenderSprites:
		Image: thcombody
	Buildable:
		Queue: Building
		BuildPaletteOrder: 92
		Prerequisites: fact, ~techlevel.medium
		Description: actor-thcom.description
		Icon: thcom-icon
	Tooltip:
		Name: actor-thcom.name
	ParatroopersPower@coord:
		OrderName: TheaterParadrop
		Icon: paratroopers
		ChargeInterval: 1500
		Name: actor-thcom.para-name
		Description: actor-thcom.para-description
		DropItems: E1R1,E1R1,E3R1,E3R1,E3R1
		ReinforcementsArrivedSpeechNotification: ReinforcementsArrived
		SelectTargetSpeechNotification: SelectTarget
		ReinforcementsArrivedTextNotification: notification-reinforcements-have-arrived
		SelectTargetTextNotification: notification-select-target
		AllowImpassableCells: false
		QuantizedFacings: 8
		CameraActor: camera.paradrop
		DisplayBeacon: true
		BeaconPoster: pinficon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		UseDirectionalTarget: True
		DirectionArrowAnimation: paradirection
		SupportPowerPaletteOrder: 50
	SupportPowerChargeBar:
	# Hosts the Command capability queue — its sidebar tab is active only while a Theater Command stands.
	# Produces only non-occupying capability actors, so no exit/placement is needed.
	Production:
		Produces: Command
	# Launch site for the science victory: the Space-Program countdown only runs while a Theater Command
	# stands, so the enemy can stall a science win by destroying it (see SpaceVictoryConditions).
	SpaceVictoryLaunchSite:

# ============================================================================
# CORE BASE-BUILDING RESKINS — bespoke modern bodies replacing the stock Red Alert art, so the whole
# base (not just the new 4X structures) reads as contemporary. Same proven pattern as the 4X buildings:
# swap RenderSprites.Image to a custom body + provide its sequences; strip the inherited death animation
# (the single-frame custom bodies have no `dead` frames — standard explosion effects still play).
# ============================================================================

# Power Plant — a modern combined-cycle gas station (turbine hall + twin stacks + transformer yard),
# distinct from the FUSION reactor's domed-containment look. 2x3 footprint; reuses the stock bib3 + icon.
POWR:
	RenderSprites:
		Image: powrbody
	-WithDeathAnimation:

# Barracks — a modern military compound (two barrack blocks, a guard tower, gatehouse, flag, hesco
# perimeter) replacing the stock RA infantry tent. 2x3; reuses bib3 + tenticon. No WithDeathAnimation on
# TENT, so nothing to strip. (TENT is also field-merged in theater-common.yaml for faction prereqs — both merge.)
TENT:
	RenderSprites:
		Image: tentbody

# Construction Yard — a modern command HQ + assembly yard with a yellow tower crane (the unmistakable
# "construction" read), glass HQ block and a vehicle assembly bay. 3x4 (biggest building); reuses bib2 +
# facticon. The stock `build`/`damaged-build` crane animations map to the static body (lost, acceptable for
# now); -WithDeathAnimation since the single-frame body has no `dead` frames.
FACT:
	RenderSprites:
		Image: factbody
	-WithDeathAnimation:

# Refinery — a modern mineral-processing plant: distillation columns with platform rings, storage tanks,
# a glowing flare stack, a central processing block and an intake hopper at the harvester dock. 3x4; reuses
# bib2 + procicon. Strip WithIdleOverlay@TOP (the stock animated top is baked into the static body — else it
# references an undefined idle-top sequence) and -WithDeathAnimation (no dead frames). DockOffset unchanged.
PROC:
	RenderSprites:
		Image: procbody
	-WithIdleOverlay@TOP:
	-WithDeathAnimation:

# War Factory — a modern vehicle-assembly plant: a tall assembly hall with a sawtooth-skylight roof, a big
# bay door (hazard header) and a finished tank rolling out the front. 3x3; reuses bib2 + weapicon. Strip
# WithProductionDoorOverlay (the stock build-top door animation is baked into the static body — leaving the
# trait would reference an undefined build-top sequence). WEAP has no WithDeathAnimation. Exit/RallyPoint kept.
WEAP:
	RenderSprites:
		Image: weapbody
	-WithProductionDoorOverlay:

# Radar Dome — a modern radar station: a white radome (golf-ball radar dome) on a control building, a
# glowing AESA phased-array panel, and antenna masts. 2x3; reuses bib3 + domeicon. Simple (no death anim /
# no dish-rotation overlay on the stock DOME). NOTE: this only changes the DOME *building*; the non-placed
# upgrade actors (econ.network/space.*/research.*/age.*) keep RenderSprites.Image: dome for their cameos.
DOME:
	RenderSprites:
		Image: domebody

# Helipad — a modern helipad: a tarmac landing pad with a painted H + circle, a hangar with a control
# room, a fuel tank, a windsock and approach lights. 2x3; reuses bib3 + hpadicon. The stock `active`
# animation maps to the static body; Reservable/dock offset (where the chopper sits) is untouched.
HPAD:
	RenderSprites:
		Image: hpadbody

# Advanced Power — a modern renewable plant: a wind turbine (vertical anchor), rows of solar panels, and
# battery-storage containers + an inverter substation. Distinct from POWR (gas) and the FUSION reactor.
# 3x3; reuses bib2 + apwricon. -WithDeathAnimation (single-frame body has no dead frames).
APWR:
	RenderSprites:
		Image: apwrbody
	-WithDeathAnimation:

# Service Depot — a modern vehicle repair depot: an overhead yellow gantry crane over a marked repair bay,
# a workshop with a roll-up door, tool chests and a generator. 3x3 (cross footprint); reuses the mbFIX bib +
# fixicon. The stock active/damaged-active repair animations map to the static body; Reservable/RepairsUnits kept.
FIX:
	RenderSprites:
		Image: fixbody

# Naval Yard — a modern shipyard: twin yellow portal gantry cranes straddling a slipway with a ship hull
# under construction, an admin/control tower with radar, dock platform + bollards. 3x3, on water (no bib);
# reuses syrdicon. No death/overlay traits; the four ship-exit cells are untouched.
SYRD:
	RenderSprites:
		Image: syrdbody

# Resource Silo — a modern bulk-storage facility: three slim conical-roofed silos with hazard bands and a
# conveyor loader. 1x1; reuses the mbSILO bib + siloicon. Keep WithResourceLevelSpriteBody (its `stages`
# sequence maps to the static body) — do NOT strip it here, since bank/alloyex inherit SILO and already
# strip it (stripping on the base too would be a double-remove). Distinct from the alloy-extractor body.
SILO:
	RenderSprites:
		Image: silobody

# Advanced Tech Center — a sleek high-tech facility: a dark-glass tower with glowing data bands, a rooftop
# satellite uplink dish + antenna array, and a white clean-room annex. Distinct from the lighter Research
# Lab. 2x3; reuses bib3 + atekicon. The stock `active` (sputdoor) animation maps to the static body.
# (ATEK is also field-merged in theater-tech.yaml — both merge.)
ATEK:
	RenderSprites:
		Image: atekbody
