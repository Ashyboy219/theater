# THEATER — shared "advanced coordination" structures.
#
# THCOM (Theater Command) is the lightweight command-capability building: a forward command post that
# gives you radar AND a real VERB — a combined-arms paradrop that coordinates reinforcements from the sky
# with your ground push. It reskins the radar dome (proven art/footprint) and adds a self-contained
# support power, so it is capture-safe. In Phase 1 it also hosts the Command production queue (Produces:
# Command) from which you buy capabilities — Fire Control, Formations, etc.

THCOM:
	Inherits: DOME
	# Bespoke forward-command-post body instead of the radar dome (DOME already uses WithSpriteBody, so the
	# image swap + thcombody sequences are all that's needed). 2x2 footprint, rendered at matching DOME scale.
	RenderSprites:
		Image: thcombody
	Buildable:
		Queue: Building
		BuildPaletteOrder: 92
		Prerequisites: fact, ~techlevel.medium
		Description: actor-thcom.description
		Icon: thcom-icon
	Tooltip:
		Name: actor-thcom.name
	ParatroopersPower@coord:
		OrderName: TheaterParadrop
		Icon: paratroopers
		ChargeInterval: 1500
		Name: actor-thcom.para-name
		Description: actor-thcom.para-description
		DropItems: E1R1,E1R1,E3R1,E3R1,E3R1
		ReinforcementsArrivedSpeechNotification: ReinforcementsArrived
		SelectTargetSpeechNotification: SelectTarget
		ReinforcementsArrivedTextNotification: notification-reinforcements-have-arrived
		SelectTargetTextNotification: notification-select-target
		AllowImpassableCells: false
		QuantizedFacings: 8
		CameraActor: camera.paradrop
		DisplayBeacon: true
		BeaconPoster: pinficon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		UseDirectionalTarget: True
		DirectionArrowAnimation: paradirection
		SupportPowerPaletteOrder: 50
	SupportPowerChargeBar:
	# Hosts the Command capability queue — its sidebar tab is active only while a Theater Command stands.
	# Produces only non-occupying capability actors, so no exit/placement is needed.
	Production:
		Produces: Command
