# ============================================================================
# Additional faction uniques (each faction gets 2-3 total). All reuse complete
# stock RA bodies and are faction-gated by tech.<faction>; identity in v1 comes
# from faction-exclusivity + the doctrine modifiers (theater-doctrines.yaml).
# Bespoke cameos/reskins are a later art pass.
# ============================================================================

# Federation (USA) — persistent close-air-support gunship.
REAPER:
	Inherits: MH60
	RenderSprites:
		Image: mh60
	Tooltip:
		Name: actor-reaper.name
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Helicopter
		BuildPaletteOrder: 93
		Prerequisites: tech.federation, hpad

# Federation (USA) — air-superiority fighter (the air-dominance identity). A dedicated air-to-air
# interceptor — the role NO other faction fields a fighter for (everyone else denies air with ground
# SAMs). Pure anti-air: helpless vs ground, so it owns the sky for SPECTER/REAPER to strike under, and
# it is still killable by enemy SAMs/MANPADS. Ammo-limited (rearms at the airfield). Reuses the MIG body.
RAPTOR:
	Inherits: MIG
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	RenderSprites:
		Image: mig
	Tooltip:
		Name: actor-raptor.name
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Plane
		BuildPaletteOrder: 89
		Prerequisites: tech.federation, afld
	Valued:
		Cost: 1800
	Armament:
		Weapon: Nike
	AutoTarget:
		InitialStance: Defend
		InitialStanceAI: Defend

