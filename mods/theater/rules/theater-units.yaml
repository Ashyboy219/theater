# THEATER — one signature unique unit per contemporary faction.
# Each reuses an existing RA body (art ceiling) with a modern name, gated to its faction via the
# tech.<faction> prerequisite from theater-factions.yaml. Modern cameos get wired once generated.

# Federation (USA) — stealth strike jet.
SPECTER:
	Inherits: MIG
	RenderSprites:
		Image: mig
	Tooltip:
		Name: actor-specter.name
	Buildable:
		Queue: Aircraft
		BuildPaletteOrder: 90
		Prerequisites: tech.federation, afld

