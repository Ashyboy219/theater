# Subcontinent Federation (India) — layered SAM battery.
AKASH:
	Inherits: AGUN
	RenderSprites:
		Image: agun
	Tooltip:
		Name: actor-akash.name
	Buildable:
		Queue: Defense
		BuildPaletteOrder: 94
		Prerequisites: tech.subcontinent_federation, dome
	# Layered air defense: a long-range standoff SAM (Nike) on a hardened battery — outranges and outlasts
	# the flak AA gun it replaces, so India's airspace is tiered (this on top; shared MANPADS / Mobile SAM
	# / AA-gun form the short-range layer below). India is the layered-air-defense faction.
	Health:
		HP: 60000
	Armament:
		Weapon: Nike
	RevealsShroud:
		MinRange: 5c0
		Range: 9c0

# Subcontinent Federation (India) — multirole strike fighter (upper air layer).
TEJAS:
	Inherits: MIG
	RenderSprites:
		Image: mig
	Tooltip:
		Name: actor-tejas.name
	Buildable:
		Queue: Aircraft
		BuildPaletteOrder: 94
		Prerequisites: tech.subcontinent_federation, afld
	# Resilient conventional air: a hardened airframe (more HP than the baseline strike jet) so India's
	# strike fighter survives a SAM pass and keeps fighting — the "resilient air power" identity.
	Health:
		HP: 11000

