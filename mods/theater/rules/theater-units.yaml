# Isles Coalition (UK) — elite infiltration team.
PATHFINDER:
	Inherits: E6
	RenderSprites:
		Image: e6
	Tooltip:
		Name: actor-pathfinder.name
	Buildable:
		Queue: Infantry
		BuildPaletteOrder: 90
		Prerequisites: tech.isles_coalition, tent
	# TOY — stealth recon infiltrator: cloaks (breaks on move/attack), sees far, and detects enemy stealth.
	Cloak:
		InitialDelay: 250
		CloakDelay: 120
		UncloakOn: Attack, Move, Unload, Infiltrate, Demolish
		DetectionTypes: Cloak
		PauseOnCondition: cloak-force-disabled
	GrantConditionOnDamageState@UNCLOAK:
		Condition: cloak-force-disabled
		ValidDamageStates: Critical
	RevealsShroud:
		Range: 9c0
		Type: CenterPosition
	DetectCloaked:
		Range: 6c0
		DetectionTypes: Cloak
	RenderDetectionCircle:

