# Northern Union (Russia) — heavy mobile air-defense (Tunguska/Pantsir-class SPAAG). A long-range anti-air
# missile on a tanky tracked chassis (Russia's baseline armor bonus applies), so it umbrellas the slow
# Russian advance and makes Russian airspace deadly. Pure AA — helpless vs ground attack, so it must be
# escorted; that is its counter. Russia is the air-DENIAL faction (it fields no offensive aircraft). Mirrors
# the proven Mobile SAM pattern (ground body + ^AutoTargetAllAssaultMove + AA missile) on a heavier chassis.
TUNGUSKA:
	Inherits: 2TNK
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	RenderSprites:
		Image: 2tnk
	Tooltip:
		Name: actor-tunguska.name
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 96
		Prerequisites: tech.northern_union, dome, weap
	Valued:
		Cost: 950
	Armament:
		Weapon: Nike
	RevealsShroud:
		MinRange: 4c0
		Range: 9c0
	AutoTarget:
		InitialStance: Defend
		InitialStanceAI: Defend

