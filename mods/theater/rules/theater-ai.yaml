	# --- Fire the doctrine support powers (merges new decisions into the shared ra SupportPowerBotModule).
	# Offensive strikes (CAS / barrage / drone-swarm / cruise / recon flyover) target enemy structures;
	# the airborne reinforcement drops near the enemy. Only the power the AI actually bought is ever ready.
	SupportPowerBotModule:
		Decisions:
			doctrine-strike-usa:
				OrderName: FederationSweepStrike
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 5c0
			doctrine-strike-rus:
				OrderName: NorthernUnionSaturationBarrage
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 5c0
			doctrine-strike-chn:
				OrderName: ChnDroneSwarm
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 5c0
			doctrine-strike-ind:
				OrderName: SubcontinentCruiseStrike
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 5c0
			doctrine-recon-uk:
				OrderName: UkReconOverflight
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 5c0
			doctrine-recon-tur:
				OrderName: AnatolianUavSweep
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 5c0
			doctrine-para-tur:
				OrderName: AnatolianRapidDeploy
				MinimumAttractiveness: 5
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 8c0
				Consideration@2:
					Against: Enemy
					Types: Water
					Attractiveness: -5
					TargetMetric: None
					CheckRadius: 8c0
			doctrine-para-uk:
				OrderName: UkSpecOpsInsertion
				MinimumAttractiveness: 5
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 8c0
				Consideration@2:
					Against: Enemy
					Types: Water
					Attractiveness: -5
					TargetMetric: None
					CheckRadius: 8c0
