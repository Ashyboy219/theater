# THEATER — teach the skirmish AI to use the faction system: build the uniques, BUY a mid-game doctrine
# branch (and the units/powers it unlocks), and fire the doctrine support powers.
#
# Doctrine stat-modifiers already apply to AI armies automatically (the AI's Construction Yard provides
# the tech.<faction> token that grants the doctrine condition). The additions below make the AI:
#   1. PRODUCE the faction uniques + doctrine-unlocked units (UnitBuilderBotModule.UnitsToBuild — a dict
#      that MERGES; faction-gating means an AI only builds what its own faction unlocks).
#   2. BUILD a Theater Command and BUY one doctrine branch from the "Command" queue. This mirrors the d2k
#      AI's upgrade-buying: add "Command" to BaseBuilderBotModule.BuildingQueues and list the items in
#      BuildingFractions/BuildingLimits. The branches are faction-gated (~tech.<faction>) and mutually
#      exclusive, so an AI buys exactly ONE — its own faction's first affordable branch. Japan/Germany
#      have no branches, so they simply build none (still fully functional).
#   3. FIRE the doctrine support powers (SupportPowerBotModule only acts on powers that have a
#      SupportPowerDecision for their OrderName — offensive strikes target enemy structures; the airborne
#      reinforcement drops near the enemy). One shared module covers every AI personality.
# These all MERGE onto the stock ra AI (mods/ra/rules/ai.yaml); only the deltas are restated here.

