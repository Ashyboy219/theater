# THEATER — grounded late-game / flagship weapons + DISTINCT strike-power munitions.
# All data-only (no C#); clone stock templates (^Cannon, ^Artillery, ^AntiGroundMissile, GravityBomb).
# Loaded via mod.yaml Weapons. Grounded modern: heavy conventional HE, fuel-air, cruise/ballistic — no nukes,
# lasers, tesla. The four "strike.*" munitions give each faction's airstrike power a DIFFERENT feel/effect.

# ===================== Flagship unit weapons =====================

# ARMATA (Russia T-14) secondary — thermobaric fuel-air shell: devastating vs infantry & structures, big blast.
Thermobaric:
	Inherits: ^Cannon
	ReloadDelay: 90
	Range: 5c512
	Report: turret1.aud
	Projectile: Bullet
		Speed: 455
		Inaccuracy: 256
	Warhead@1Dam: SpreadDamage
		Spread: 597
		Damage: 9000
		Falloff: 100, 80, 55, 30, 12, 0
		Versus:
			None: 100
			Wood: 100
			Light: 65
			Heavy: 40
			Concrete: 95
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		ValidTargets: Ground, Infantry
	Warhead@3Eff: CreateEffect
		Explosions: artillery_explosion
		ImpactSounds: kaboom25.aud
		ValidTargets: Ground, GroundActor, WaterActor, Trees

# B-21 (USA) heavy precision bomb stick — a strategic stealth bomber's payload: heavy vs armor/structures.
