# AGNI (India) road-mobile ballistic launcher — longest reach in the game, slow, heavy conventional warhead.
AgniBallistic:
	Inherits: ^Artillery
	MinRange: 5c0
	ReloadDelay: 320
	Range: 20c0
	Burst: 1
	Report: turret1.aud
	TargetActorCenter: true
	InvalidTargets: Air, AirborneActor
	# VISIBLE ballistic missile: a Bullet projectile with no Image renders NOTHING (the longest-range weapon
	# in the game was firing an invisible shell). Use a homing Missile with the MISSILE sprite + a long smoke
	# contrail so the strike reads as an arcing ballistic missile streaking in from off-screen.
	Projectile: Missile
		Image: MISSILE
		Speed: 213
		Arm: 6
		Inaccuracy: 1c256
		RangeLimit: 26c0
		TrailImage: smokey
		ContrailLength: 48
	Warhead@1Dam: SpreadDamage
		Spread: 511
		Damage: 13000
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		Versus:
			None: 70
			Wood: 90
			Light: 70
			Heavy: 55
			Concrete: 120
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
	Warhead@3Eff: CreateEffect
		Explosions: artillery_explosion
		ImpactSounds: kaboom25.aud
		ValidTargets: Ground, GroundActor, WaterActor, Trees

