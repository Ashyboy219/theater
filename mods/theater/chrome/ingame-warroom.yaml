# THEATER — National Command / War Room: a full-screen command dashboard.
# Opened via Ui.OpenWindow("WARROOM_ROOT", {world}) from the Theater Command (or /warroom).
# Driven by WarRoomLogic. Every @Id is globally unique (WR_ prefix). Layout is WINDOW_WIDTH/HEIGHT
# relative so it adapts to the UI resolution. Art regions are display-sized (ImageWidget draws native).
