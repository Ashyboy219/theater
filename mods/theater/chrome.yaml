# THEATER — chrome collections (custom War Room art). All PNGs are power-of-two; regions are display-sized
# because OpenRA's ImageWidget draws a region at its native pixel size (it does not scale to widget bounds).
warroom-president:
	Image: warroom/president-warroom-bg.png
	Regions:
		background: 0, 0, 420, 260
warroom-crest:
	Image: warroom/theater-crest.png
	Regions:
		crest: 4, 4, 56, 56
warroom-staff:
